appId: com.mediaforge.desktop
productName: MediaForge Desktop
copyright: Copyright © 2026 MediaForge contributors

directories:
  output: dist
  buildResources: build

# v27 defaults every toolset to "latest"; pin the one the MSIX target depends on so a toolset
# release cannot silently change what a given MediaForge tag builds. 1.3.0 ships Windows Kits
# 10.0.26100.0, which is what provides makeappx.exe/makepri.exe (AM-22).
toolsets:
  winCodeSign: '1.3.0'

files:
  - out/**
  - package.json

extraResources:
  - from: binaries/win32
    to: binaries/win32
    filter:
      - yt-dlp.exe
      - ffmpeg.exe
      # AM-21: yt-dlp cannot solve YouTube's JS challenges without an external runtime. QuickJS-NG
      # (~2 MB) ships; a user-supplied deno.exe in <userData>/binaries/win32 is preferred when
      # present, but is deliberately never bundled (~42 MB) — hence the explicit allowlist here.
      - qjs.exe
  - from: resources/LICENSES
    to: LICENSES

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # Deliberately unsigned (AGENTS.md §14): an OV cert costs money and still doesn't grant
  # instant SmartScreen trust, only EV does. Mitigated with a documented workaround instead
  # (README "Note on Windows SmartScreen") plus in-app SHA-256 checksum verification.
  # Without cert config, electron-builder skips signing but still embeds icon + metadata.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  artifactName: ${productName}-Setup-${version}.${ext}

# --- Microsoft Store (MSIX) — AM-22 -------------------------------------------------------------
# Built on demand with `npm run dist:store` (or the Store workflow). NSIS above stays the default
# target, so a problem with the beta MSIX target can never block a GitHub release.
msix:
  # MUST equal the Package/Identity Name reserved in Partner Center for this app, otherwise the
  # submission is rejected on identity mismatch. Rename here when the Store assigns its own value.
  identityName: prodip-datta.MediaForgeDesktop
  # Field of the Application Id; with the package family name this forms the AppUserModelID that
  # Windows uses for toast notifications. AM-22 leaves the AUMID to the manifest rather than
  # calling app.setAppUserModelId, which is what makes notifications work in a packaged app.
  applicationId: MediaForge
  displayName: MediaForge Desktop
  publisherDisplayName: prodip-datta
  publisher: CN=A7495C95-C0D6-45CC-8B46-EFECB9B25924
  # `publisher` is deliberately omitted: with no signing certificate configured, electron-builder
  # emits the `CN=ms` placeholder that the Store replaces when it re-signs on submission.
  # Sideload testing instead needs a certificate whose Subject matches a publisher you pass:
  #   npx electron-builder --win msix -c.msix.publisher="CN=Your Name"
  #
  # runFullTrust is always injected for Electron apps. internetClient covers yt-dlp's downloads;
  # privateNetworkClientServer covers the Local Share LAN server (a packaged app that accepts
  # inbound LAN connections must declare it).
  capabilities:
    - internetClient
    - privateNetworkClientServer
  # Partner Center accepts a bare .msix, but recommends the upload wrapper; the Store re-signs it.
  createMsixupload: true
  languages:
    - en-US
  # No spaces: GitHub rewrites spaces to periods in release asset names (see AGENTS.md §7.6).
  artifactName: MediaForge-Desktop-${version}-store.${ext}
